{% if query %}
  <ul class="cat-tree">
    {% for c in results %}
      <li><a href="{{ c.get_absolute_url }}" class="cat-link">{{ c.name }}{% if c.parent %} <span class="muted small">in {{ c.parent }}</span>{% endif %}</a></li>
    {% empty %}<li class="muted small" style="padding: 8px 12px">No category matches "{{ query }}".</li>{% endfor %}
  </ul>
{% endif %}
