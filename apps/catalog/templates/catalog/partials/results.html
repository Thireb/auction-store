<div id="results">
  <p class="text-sm text-gray-500">{{ page_obj.paginator.count }} product{{ page_obj.paginator.count|pluralize }}</p>
  <div id="product-grid" class="mt-3 grid grid-cols-2 md:grid-cols-3 gap-4">
    {% for product in products %}
      {% include "catalog/partials/product_card.html" %}
    {% empty %}
      <p class="col-span-full text-gray-500">No products match. Try fewer filters.</p>
    {% endfor %}
  </div>
  {% include "catalog/partials/pagination.html" %}
</div>
