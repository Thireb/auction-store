{% load category_nav %}
<nav id="category-nav" class="cat-nav stack" aria-label="Categories" x-data="{ q: '' }">
  <div class="row between">
    <p class="h3" style="margin: 0">Browse</p>
    <button type="button" class="icon-btn" @click="$dispatch('nav-close'); nav = false" aria-label="Close categories">{% include "partials/icon.html" with name="close" %}</button>
  </div>
  <label for="category-find" class="sr-only">Find a category</label>
  <input id="category-find" type="search" name="q" x-model="q" placeholder="Find a category"
         hx-get="{% url 'catalog:nav_search' %}" hx-trigger="input changed delay:300ms, search" hx-target="#category-search-results">
  <div id="category-search-results" x-show="q" x-cloak></div>
  <div x-show="!q">
    <ul class="cat-tree">
      <li><a href="{% url 'lots:list' %}" class="cat-link">Lots</a></li>
      <li><a href="{% url 'catalog:product_list' %}" class="cat-link {% if request.resolver_match.url_name == 'product_list' %}is-current{% endif %}">All products</a></li>
    </ul>
    {% include "catalog/partials/category_tree.html" %}
  </div>
</nav>
