{% extends "portal/base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white border rounded p-6">
  <h1 class="text-xl font-bold">Staff log in</h1>
  <form method="post" class="mt-4 space-y-3">
    {% csrf_token %}
    {% include "portal/partials/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full px-3 py-2 rounded bg-gray-900 text-white">Log in</button>
  </form>
</div>
{% endblock %}
