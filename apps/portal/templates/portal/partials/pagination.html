{% if page_obj.has_other_pages %}
<nav class="mt-4 flex items-center gap-3">
  {% if page_obj.has_previous %}<a class="px-3 py-1 border rounded bg-white" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} rows)</span>
  {% if page_obj.has_next %}<a class="px-3 py-1 border rounded bg-white" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>
{% else %}<p class="mt-3 text-gray-500">{{ page_obj.paginator.count }} rows</p>{% endif %}
