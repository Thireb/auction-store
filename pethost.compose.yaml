# Production on PetHost. Local development uses compose.yaml.
# Secrets live in the project's /.env on PetHost (see .env.prod.example), never in this file.
services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file: .env
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
  backups:

x-pethost:
  metadata: { name: Auction Store }
  routes:
    # Free address on Ahmad's machine. Change it for your own domain.
    - { host: auction-store.thireb.pethost.app, service: caddy, port: 8080 }
