<header class="bg-white border-b" x-data="{ open: false }">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="{% url 'core:home' %}" class="font-bold text-lg">{{ STORE_NAME }}</a>
    <nav class="hidden sm:flex gap-4 text-sm" id="main-nav">
      <a href="{% url 'catalog:product_list' %}">All products</a>
      {% for cat in nav_categories %}<a href="{{ cat.get_absolute_url }}">{{ cat.name }}</a>{% endfor %}
    </nav>
    <div class="ml-auto flex items-center gap-4 text-sm">
      <a href="{% url 'track_order' %}" class="hidden sm:inline">Track order</a>
      {% if user.is_authenticated %}<a href="{% url 'accounts:account' %}">My account</a>{% else %}<a href="{% url 'accounts:login' %}">Log in</a>{% endif %}
      <a href="{% url 'cart:detail' %}" id="cart-link" class="font-medium">
        Cart (<span id="cart-count">{{ cart_count|default:0 }}</span>)
      </a>
      <button type="button" class="sm:hidden" @click="open = !open" aria-label="Menu">&#9776;</button>
    </div>
  </div>
  <nav class="sm:hidden px-4 pb-3 text-sm flex flex-col gap-2" x-show="open" x-cloak>
    <a href="{% url 'catalog:product_list' %}">All products</a>
    {% for cat in nav_categories %}<a href="{{ cat.get_absolute_url }}">{{ cat.name }}</a>{% endfor %}
  </nav>
</header>
