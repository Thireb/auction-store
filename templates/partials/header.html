<header class="bg-white border-b">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
    <button type="button" class="lg:hidden px-2 py-1 border rounded text-sm" @click="$dispatch('nav-open')" aria-controls="sidebar" aria-label="Open categories">&#9776; Categories</button>
    <a href="{% url 'core:home' %}" class="font-bold text-lg">{{ STORE_NAME }}</a>
    <form action="{% url 'catalog:product_list' %}" method="get" class="hidden md:block ml-4 flex-1 max-w-md">
      <input type="search" name="q" placeholder="Search products" aria-label="Search products" class="w-full border rounded px-2 py-1 text-sm">
    </form>
    <div class="ml-auto flex items-center gap-4 text-sm">
      <a href="{% url 'track_order' %}" class="hidden sm:inline">Track order</a>
      {% if user.is_staff %}<a href="{% url 'portal:dashboard' %}" class="hidden sm:inline">Staff portal</a>{% endif %}
      {% if user.is_authenticated %}<a href="{% url 'accounts:account' %}">My account</a>{% else %}<a href="{% url 'accounts:login' %}">Log in</a>{% endif %}
      <a href="{% url 'cart:detail' %}" id="cart-link" class="font-medium">
        Cart (<span id="cart-count">{{ cart_count|default:0 }}</span>)
      </a>
    </div>
  </div>
  <form action="{% url 'catalog:product_list' %}" method="get" class="md:hidden px-4 pb-3">
    <input type="search" name="q" placeholder="Search products" aria-label="Search products" class="w-full border rounded px-2 py-1 text-sm">
  </form>
</header>
