<div id="messages" class="max-w-6xl mx-auto px-4">
  {% for message in messages %}
    <div class="mt-4 rounded border px-4 py-2 text-sm
                {% if message.tags == 'error' %}border-red-300 bg-red-50{% elif message.tags == 'success' %}border-green-300 bg-green-50{% else %}border-gray-300 bg-white{% endif %}"
         x-data="{ show: true }" x-show="show">
      {{ message }}
      <button type="button" class="float-right" @click="show = false" aria-label="Close">&times;</button>
    </div>
  {% endfor %}
</div>
