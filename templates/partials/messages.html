<div id="messages" class="wrap" aria-live="polite">
  {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="msg{% if message.tags %} msg-{{ message.tags }}{% endif %}" x-data="{ show: true }" x-show="show">
          <span>{{ message }}</span>
          <button type="button" @click="show = false" aria-label="Close message">&times;</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
